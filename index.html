<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <nav id="top-nav">
            <span class="logo">History Quiz</span>
            <div id="user-bar" class="hidden">
                <span id="user-email"></span>
                <span id="user-coins"></span>
                <button class="btn ghost small" onclick="showView('shop')">Shop</button>
                <button class="btn ghost small" onclick="logout()">Uitloggen</button>
            </div>
        </nav>

        <!-- HOME -->
        <section id="view-home" class="view active">
            <div class="card">
                <h2>Welkom bij de History Quiz!</h2>
                <p>Test je geschiedeniskennis met vrienden.</p>
                <button class="btn primary" onclick="showView('host')">Quiz Hosten</button>
                <button class="btn secondary" onclick="showView('join')">Meedoen aan Quiz</button>
                <hr>
                <button class="btn ghost" id="login-btn-home" onclick="showView('login')">Inloggen / Registeren</button>
            </div>
        </section>

        <!-- LOGIN -->
        <section id="view-login" class="view">
            <div class="card" id="login-form">
                <h2>Account</h2>
                <input type="email" id="auth-email" placeholder="E-mail">
                <input type="password" id="auth-password" placeholder="Wachtwoord">
                <p id="auth-error" class="hidden" style="color:#e74c3c;font-size:0.9rem;"></p>
                <button class="btn primary" onclick="login()">Inloggen</button>
                <button class="btn secondary" onclick="register()">Account maken</button>
                <button class="btn ghost" onclick="goHome()">Terug</button>
            </div>
        </section>

        <!-- SHOP -->
        <section id="view-shop" class="view">
            <div class="card">
                <h2>Skin Shop</h2>
                <p id="shop-coins"></p>
                <div id="skin-grid"></div>
                <button class="btn ghost" onclick="goHome()">Terug</button>
            </div>
        </section>

        <!-- JOIN -->
        <section id="view-join" class="view">
            <div class="card">
                <h2>Meedoen aan Quiz</h2>
                <input type="text" id="join-name" placeholder="Jouw naam" maxlength="30">
                <input type="text" id="join-code" placeholder="Quiz code" maxlength="6" style="text-transform:uppercase">
                <button class="btn primary" onclick="joinGame()">Meedoen</button>
                <button class="btn ghost" onclick="goHome()">Terug</button>
            </div>
        </section>

        <!-- HOST -->
        <section id="view-host" class="view">
            <div class="card" id="host-setup">
                <h2>Quiz Host</h2>
                <input type="text" id="host-name" placeholder="Jouw naam" maxlength="30">
                <label class="checkbox-label">
                    <input type="checkbox" id="host-participate" checked>
                    Ik doe zelf ook mee als speler
                </label>
                <div id="saved-quiz-select" class="hidden">
                    <label style="color:#aaa;font-size:0.9rem;">Of laad een opgeslagen quiz:</label>
                    <select id="load-quiz-select" onchange="onLoadQuizSelect()">
                        <option value="">-- Kies een quiz --</option>
                    </select>
                    <button class="btn secondary small" onclick="loadSavedQuiz()">Laden</button>
                </div>
                <button class="btn primary" onclick="createGame()">Nieuwe Quiz Starten</button>
                <button class="btn ghost" onclick="goHome()">Terug</button>
            </div>

            <div class="card hidden" id="host-lobby">
                <h2>Quiz Lobby</h2>
                <p>Deel deze code met spelers:</p>
                <div id="game-code-display"></div>
                <div id="player-list"></div>

                <div id="question-editor">
                    <h3>Vragen beheren</h3>
                    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;">
                        <button class="btn secondary small" onclick="saveQuizTemplate()">Quiz opslaan</button>
                    </div>
                    <div id="question-list"></div>
                    <button class="btn secondary" onclick="addQuestion()">+ Vraag Toevoegen</button>

                    <div id="question-form" class="hidden">
                        <select id="q-type" onchange="onQuestionTypeChange()">
                            <option value="multiple">Meerkeuze (A/B/C/D)</option>
                            <option value="truefalse">Waar / Niet waar</option>
                            <option value="open">Open vraag</option>
                        </select>
                        <input type="text" id="q-text" placeholder="Vraag">
                        <div id="q-options-group">
                            <input type="text" id="q-opt0" placeholder="Optie A">
                            <input type="text" id="q-opt1" placeholder="Optie B">
                            <input type="text" id="q-opt2" placeholder="Optie C">
                            <input type="text" id="q-opt3" placeholder="Optie D">
                            <div class="q-answer-select">
                                <label>Juiste antwoord:</label>
                                <select id="q-answer">
                                    <option value="0">A</option><option value="1">B</option>
                                    <option value="2">C</option><option value="3">D</option>
                                </select>
                            </div>
                        </div>
                        <div id="q-truefalse-group" class="hidden">
                            <div class="q-answer-select">
                                <label>Juiste antwoord:</label>
                                <select id="q-tf-answer">
                                    <option value="true">Waar</option>
                                    <option value="false">Niet waar</option>
                                </select>
                            </div>
                        </div>
                        <div id="q-open-group" class="hidden">
                            <input type="text" id="q-open-answer" placeholder="Juiste antwoord (optioneel)">
                        </div>
                        <button class="btn primary" onclick="saveQuestion()">Opslaan</button>
                        <button class="btn ghost" onclick="cancelQuestionEdit()">Annuleren</button>
                    </div>
                </div>

                <div id="lobby-actions">
                    <button class="btn primary" onclick="startGame()">Start Quiz</button>
                    <button class="btn ghost" onclick="cancelGame()">Annuleren</button>
                </div>
            </div>

            <div class="card hidden" id="host-game">
                <h2>Quiz Bezig</h2>
                <div id="host-leaderboard">
                    <h3>Scorebord</h3>
                    <div id="host-scoreboard"></div>
                </div>
                <div id="host-question-area">
                    <p id="host-question-number"></p>
                    <p id="host-question-text"></p>
                    <div id="host-options"></div>
                    <div id="host-open-answers" class="hidden"></div>
                </div>
                <div id="host-controls">
                    <button class="btn primary" id="btn-next-question" onclick="nextQuestion()">Volgende Vraag</button>
                    <button class="btn danger" onclick="endGame()">Quiz Beëindigen</button>
                </div>
                <div id="host-answers-status"></div>
            </div>

            <div class="card hidden" id="host-result">
                <h2>Eindstand</h2>
                <p id="earnings-msg" class="hidden"></p>
                <div id="final-standings"></div>
                <button class="btn primary" onclick="resetQuiz()">Nieuwe Quiz</button>
            </div>
        </section>

        <!-- PLAYER -->
        <section id="view-play" class="view">
            <div class="card hidden" id="play-lobby">
                <h2>Wachten op quiz...</h2>
                <p id="play-waiting-msg"></p>
            </div>
            <div class="card hidden" id="play-question">
                <p id="play-question-number"></p>
                <p id="play-question-text"></p>
                <div id="play-options"></div>
                <div id="play-open-input" class="hidden">
                    <input type="text" id="play-open-answer" placeholder="Typ je antwoord...">
                    <button class="btn primary" onclick="submitOpenAnswer()">Verzend</button>
                </div>
                <p id="play-feedback" class="hidden"></p>
                <p id="play-score-display">Score: 0</p>
            </div>
            <div class="card hidden" id="play-result">
                <h2>Quiz Voltooid!</h2>
                <p id="play-final-score"></p>
                <div id="play-standings"></div>
            </div>
        </section>
    </div>

    <button id="error-log-btn" onclick="toggleErrorLog()" title="Error Log">⚠</button>
    <div id="error-log-modal" class="hidden">
        <div id="error-log-header"><span>Error Log</span><button onclick="toggleErrorLog()">✕</button></div>
        <div id="error-log-list"></div>
        <button id="error-log-clear" onclick="clearErrorLog()">Wis log</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
